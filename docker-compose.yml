version: '3.8'

name: ubajara-api

services:
  postgres:
    image: postgres:16
    container_name: ubajara_postgres
    environment:
      POSTGRES_DB: ubajara_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ubajara_api
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ubajara_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      CLOUDFRONT_URL: ${CLOUDFRONT_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_REDIRECT_URL: ${FRONTEND_REDIRECT_URL:-http://localhost:5173/login-success}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8081:8081"

volumes:
  postgres_data: